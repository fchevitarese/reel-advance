<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: system-ui, sans-serif; color: #fff; background: linear-gradient(135deg, #1e1b4b, #0f172a 55%, #042f2e); overflow: hidden; }
  .frame { position: relative; display: flex; align-items: center; gap: 40px; padding: 0 72px; }
  .shot { width: 1280px; height: 800px; }
  .tile { width: 440px; height: 280px; padding: 0 32px; gap: 24px; }
  h1 { font-size: 46px; line-height: 1.1; margin: 18px 0 16px; letter-spacing: -0.02em; }
  p { font-size: 22px; line-height: 1.45; color: #c7d2fe; margin: 0; max-width: 470px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 22px; color: #e0e7ff; }
  .brand img { width: 44px; height: 44px; }
  .copy { flex: none; width: 460px; }

  .reel { position: relative; width: 250px; height: 444px; border-radius: 22px; overflow: hidden; flex: none;
          box-shadow: 0 30px 60px rgba(0,0,0,.45); }
  .reel.a { background: linear-gradient(160deg, #a3e635, #10b981 60%, #0f766e); }
  .reel.b { background: linear-gradient(160deg, #22d3ee, #2563eb 60%, #1e3a8a); }
  .reel .bar { position: absolute; left: 14px; right: 14px; bottom: 18px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.35); }
  .reel .bar i { display: block; height: 100%; border-radius: 3px; background: #fff; }
  .reel .play { position: absolute; inset: 0; margin: auto; width: 0; height: 0;
                border-left: 46px solid rgba(255,255,255,.9); border-top: 28px solid transparent; border-bottom: 28px solid transparent; transform: translateX(8px); }
  .reel .tag { position: absolute; top: 16px; left: 16px; font-size: 15px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.35); }
  .stack { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .arrow { font-size: 40px; color: #5eead4; line-height: 1; }

  .popup { width: 268px; padding: 16px; border-radius: 14px; background: #121212; color: #eee; font-size: 14px;
           box-shadow: 0 30px 60px rgba(0,0,0,.5); border: 1px solid #2a2a2a; flex: none; }
  .popup h2 { font-size: 15px; margin: 0 0 12px; }
  .popup label { display: block; margin: 10px 0 5px; color: #aaa; }
  .popup .sel { background: #222; border: 1px solid #333; border-radius: 6px; padding: 6px 8px; }
  .popup .opts { margin-top: 4px; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
  .popup .opts div { padding: 7px 9px; background: #1b1b1b; }
  .popup .opts div.on { background: #6366f1; color: #fff; }
  .popup .range { position: relative; height: 6px; border-radius: 3px; background: #444; margin: 10px 0 4px; }
  .popup .range i { position: absolute; left: 0; top: 0; bottom: 0; width: 15%; border-radius: 3px; background: #6366f1; }
  .popup .range b { position: absolute; left: 15%; top: 50%; width: 14px; height: 14px; border-radius: 50%; background: #fff; transform: translate(-50%, -50%); }
  .popup .btn { margin-top: 14px; padding: 10px; text-align: center; border-radius: 8px; font-weight: 600; background: #444; }
  .popup .hint { margin-top: 10px; font-size: 12px; color: #777; }
  .badge { position: absolute; top: -10px; right: -10px; font-size: 12px; font-weight: 700; padding: 3px 7px; border-radius: 6px; background: #6366f1; }
</style>
</head>
<body>
<div id="root"></div>
<script src="render.js"></script>
</body>
</html>
